name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scoring:
    name: Scoring, reports and Windows collectors
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        shell: pwsh
        run: |
          foreach ($file in @('./WindowsSecurityAudit.ps1', './Invoke-SentinelRemote.ps1', './Compare-SentinelReport.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Host "${file}:$($_.Extent.StartLineNumber): $($_.Message)"
              }
              exit 1
            }
            Write-Host "Parsed $file."
          }

      # Collector smoke tests validate the report contract independently of
      # the protections and hardware configured on the runner.
      - name: Audit checks (PowerShell 7)
        shell: pwsh
        run: |
          ./tests/Test-Sentinel.ps1
          ./tests/Test-Compare.ps1
          ./tests/Test-HtmlReport.ps1
          ./tests/Test-Collectors.ps1

      - name: Audit checks (Windows PowerShell 5.1)
        shell: powershell
        run: |
          ./tests/Test-Sentinel.ps1
          ./tests/Test-Compare.ps1
          ./tests/Test-HtmlReport.ps1
          ./tests/Test-Collectors.ps1
