name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scoring:
    name: Scoring regression tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './WindowsSecurityAudit.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host "L$($_.Extent.StartLineNumber): $($_.Message)"
            }
            exit 1
          }
          Write-Host 'Parsed clean.'

      # The audit itself needs real hardware (TPM, BitLocker, Security Center)
      # so it is not meaningful on a runner. The scoring model is the part that
      # must never regress, and that is pure logic - so that is what is gated.
      - name: Scoring tests (PowerShell 7)
        shell: pwsh
        run: ./tests/Test-Sentinel.ps1

      - name: Scoring tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Test-Sentinel.ps1
